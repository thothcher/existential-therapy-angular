<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>ყოფნა · ეგზისტენციალური თერაპია</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ეგზისტენციალური თერაპიის სასწავლო პლატფორმა ქართულად: ოთხი მოცემულობა, მოაზროვნეები, პრაქტიკები, სცენარები და ინტერაქტიული სავარჯიშოები.">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/svg+xml" href="mark.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

  <!-- Theme applied before the first paint, so a dark-mode visitor never sees
       a light flash. The CBT app booted its theme inside a framework effect
       and flashed on every load. ThemeService reads the same key. -->
  <script>
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem("et_theme"));
        var theme = (stored === "dark" || stored === "light")
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* storage unavailable — the CSS default applies */ }
    })();
  </script>
</head>
<body class="page-shell">
  <app-root></app-root>
</body>
</html>
