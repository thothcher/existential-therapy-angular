<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable film grain. Sits under every media plate so that a blocked or
     slow remote image degrades to a textured surface rather than a flat hole. -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.055"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#g)"/>
</svg>
